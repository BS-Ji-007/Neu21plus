name: Build

on:
  push:
    branches:
      - "*"
    paths-ignore:
      - "README.md"
      - "COPYING"
      - "COPYING.LESSER"
      - ".gitignore"
      - "Update Notes"
  pull_request:
    branches:
      - "*"
    paths-ignore:
      - "README.md"
      - "COPYING"
      - "COPYING.LESSER"
      - ".gitignore"
      - "Update Notes"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon
