name: Build

on:
  push:
    branches:
      - "*"
    paths-ignore:
      - "README.md"
      - "COPYING"
      - "COPYING.LESSER"
      - ".gitignore"
      - "Update Notes"
  pull_request:
    branches:
      - "*"
    paths-ignore:
      - "README.md"
      - "COPYING"
      - "COPYING.LESSER"
      - ".gitignore"
      - "Update Notes"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    env:
      GIT_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}
      REF_NAME: ${{ github.ref_name }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      ACTOR: ${{ github.actor }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Send Discord Notification (Start)
        id: sendmsg
        if: ${{ env.WEBHOOK_URL }}
        run: ./.github/workflows/send_webhook_update.sh
        env:
          STATUS: WORKING

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin' # Standard reliable distribution for 2026

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/p-modern' }}

      - name: Build with Gradle
        run: ./gradlew clean test remapJar --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotEnoughUpdates-Fabric-1.26.1
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Update Discord Notification (Success)
        if: ${{ env.WEBHOOK_URL && success() }}
        run: ./.github/workflows/send_webhook_update.sh
        env:
          STATUS: SUCCESS
          MESSAGE_ID: ${{ steps.sendmsg.outputs.MESSAGE_ID }}

      - name: Update Discord Notification (Failure)
        if: ${{ env.WEBHOOK_URL && failure() }}
        run: ./.github/workflows/send_webhook_update.sh
        env:
          STATUS: FAILURE
          MESSAGE_ID: ${{ steps.sendmsg.outputs.MESSAGE_ID }}
