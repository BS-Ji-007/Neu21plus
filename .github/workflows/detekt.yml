name: Detekt Analysis

on:
  push:
    branches: [ "p-modern", "main" ]
  pull_request:
    branches: [ "*" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  detekt:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[no infer]')"
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Detekt
        run: ./gradlew :detektMain --stacktrace

      - name: Report Results
        if: always()
        run: |
          if [ -f build/reports/detekt/main.sarif ]; then
            jq -r '.runs[].results[]|select(.level != "error")|"::warning file="+(.locations[].physicalLocation.artifactLocation.uri)+",line="+(.locations[].physicalLocation.region.startLine|tostring)+"::"+.message.text' < build/reports/detekt/main.sarif
            jq -r '.runs[].results[]|select(.level == "error")|"::error file="+(.locations[].physicalLocation.artifactLocation.uri)+",line="+(.locations[].physicalLocation.region.startLine|tostring)+"::"+.message.text' < build/reports/detekt/main.sarif
          fi
          
          if [ -f build/reports/detekt/main.md ]; then
            cat build/reports/detekt/main.md >> $GITHUB_STEP_SUMMARY
          fi
          
          bugcount=$(jq -r '[.runs[].results[]] | length' < build/reports/detekt/main.sarif 2>/dev/null || echo 0)
          echo "### Detekt found $bugcount issue(s)." >> $GITHUB_STEP_SUMMARY
          
          if [ "$bugcount" -ne 0 ] && [ "${{ github.event_name }}" == "pull_request" ]; then
            # Fail on PRs if bugs are found
            # exit 1 
            echo "Issues found, but continuing for report."
          fi
