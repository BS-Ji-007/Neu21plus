name: Detekt Analysis

on:
  push:
    branches: [ "p-modern", "main" ]
  pull_request:
    branches: [ "*" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detekt:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[no infer]')"
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Detekt
        run: ./gradlew :detektMain --stacktrace || echo "Detekt found issues"

      - name: Summary
        run: |
          echo "Detekt analysis completed." >> $GITHUB_STEP_SUMMARY
